    hex: "#000000"
    lab: [0, 0, 0]
  - name: White
    hex: "#FFFFFF"
    lab: [100, 0, 0]
  - name: Grey
    hex: "#808080"
    lab: [53, 0, 0]
  - name: Navy
    hex: "#000080"
    lab: [13, 19, -44]
  - name: Blue
    hex: "#0000FF"
    lab: [32, 79, -108]
  - name: Light Blue
    hex: "#ADD8E6"
    lab: [84, -14, -16]
  - name: Beige
